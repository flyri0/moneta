[build]
    command = "pnpm run build"
    publish = "build"

# The app is a single-page app: every route that isn't a file gets index.html. A 200 rule without
# `force` only applies when no file matches, so assets and the service worker are served as is.
[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

# Optional hardening: the Content-Security-Policy ships in the HTML as a <meta> tag. These cover
# what a meta tag can't (framing, the workers below) and add the usual safe defaults.
[[headers]]
    for = "/*"
    [headers.values]
        Content-Security-Policy = "frame-ancestors 'none'"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "no-referrer"
        Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# A worker doesn't take the page's <meta> policy: it follows the headers of its own script. The
# database worker (which reads backup files) and the service worker get a policy of their own.
[[headers]]
    for = "/_app/immutable/workers/*"
    [headers.values]
        Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; object-src 'none'; base-uri 'none'"

[[headers]]
    for = "/sw.js"
    [headers.values]
        Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"
