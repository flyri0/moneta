name: Preview

# Deploys each pull request to a Netlify preview of its own (https://pr-<number>--<site>.netlify.app),
# keeps one comment on the pull request up to date with its link, and removes the preview when the
# pull request closes. Production deploys stay in deploy.yml.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

# One run per pull request: a new push cancels the preview still being made for the one before.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  ALIAS: pr-${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # Builds the pull request's code with no secrets and a read-only token, so nothing it runs (its
  # install scripts, its build) can reach the Netlify token. The deploy below only moves files.
  build:
    name: Build preview
    # Pull requests from forks get no secrets, so they get no preview. Dependabot's do, from the
    # Dependabot secrets: NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID must be set there too.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Built here rather than by `netlify deploy`, so without the site's environment variables:
      # signing in to Google only works from addresses registered with it, and every preview has a
      # new one, so previews leave cloud backups out (no VITE_GOOGLE_CLIENT_ID).
      - run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-build
          path: build/
          retention-days: 1

  # Runs main's code (its lockfile, its comment script), never the pull request's: only the built
  # files come from the pull request, and they are uploaded, not run.
  deploy:
    name: Deploy preview
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    # Shows the preview on the pull request as a deployment, with a "View deployment" button.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Say the preview is on its way
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/preview-comment.sh "### ⏳ Preview

          Deploying a preview of ${HEAD_SHA::7}… ([progress]($RUN_URL))"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.build.result == 'success'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.build.result == 'success'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: needs.build.result == 'success'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.result == 'success'
        with:
          name: preview-build
          path: ${{ runner.temp }}/build

      # A draft deploy under a fixed alias, so each pull request keeps one address. Without cloud
      # backups the token function has nothing to do, so it stays out (an empty functions folder):
      # the site's Google client secret never meets code that hasn't been merged.
      - name: Deploy to Netlify
        id: deploy
        if: needs.build.result == 'success'
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is missing. Dependabot's pull requests read the Dependabot secrets, not the Actions ones."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/no-functions"
          pnpm exec netlify deploy --no-build --dir "$RUNNER_TEMP/build" --functions "$RUNNER_TEMP/no-functions" \
            --alias "$ALIAS" --message "PR #$PR · ${HEAD_SHA::7}" --json > "$RUNNER_TEMP/deploy.json"
          site=$(jq -r .site_name "$RUNNER_TEMP/deploy.json")
          {
            echo "url=https://$ALIAS--$site.netlify.app"
            # deploy_url is the alias; the deploy's own address keeps this commit after later pushes.
            echo "permalink=https://$(jq -r .deploy_id "$RUNNER_TEMP/deploy.json")--$site.netlify.app"
            echo "logs=$(jq -r .logs "$RUNNER_TEMP/deploy.json")"
          } >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Post the link
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PERMALINK: ${{ steps.deploy.outputs.permalink }}
          LOGS: ${{ steps.deploy.outputs.logs }}
        run: |
          .github/scripts/preview-comment.sh "### 🔍 Preview

          | | |
          | --- | --- |
          | **Preview** | $URL |
          | **This commit** | [${HEAD_SHA::7}]($PERMALINK) |
          | **Deploy log** | [Netlify]($LOGS) |

          Updated on every push. A preview is a site of its own, so its budgets are kept apart from the
          real app's; cloud backups are left out (Google only signs in from registered addresses)."

      - name: Say the preview failed
        if: failure() || needs.build.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/preview-comment.sh "### ❌ Preview

          The preview of ${HEAD_SHA::7} failed. See [the run]($RUN_URL)."

  remove:
    name: Remove preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Only for the comment script, taken from main: the pull request's own copy would run here
      # with this job's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Deletes every deploy the pull request made (their messages start "PR #<number> ·"). The list
      # is newest first, so it stops at deploys older than the pull request.
      - name: Delete the preview's deploys
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          OPENED: ${{ github.event.pull_request.created_at }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is missing. Dependabot's pull requests read the Dependabot secrets, not the Actions ones."
            exit 1
          fi
          api=https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys
          auth="Authorization: Bearer $NETLIFY_AUTH_TOKEN"
          ids=()
          for page in $(seq 1 20); do
            deploys=$(curl -fsS -H "$auth" "$api?per_page=100&page=$page")
            [ "$(jq length <<< "$deploys")" -eq 0 ] && break
            mapfile -t -O "${#ids[@]}" ids < <(jq -r --arg title "PR #$PR ·" \
              '.[] | select(.context != "production" and ((.title // "") | startswith($title))) | .id' \
              <<< "$deploys")
            [[ "$(jq -r '.[-1].created_at' <<< "$deploys")" < "$OPENED" ]] && break
          done
          for id in "${ids[@]}"; do
            curl -fsS -X DELETE -H "$auth" "$api/$id" > /dev/null
          done
          echo "Deleted ${#ids[@]} deploys."

      - name: Say the preview is gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/preview-comment.sh "### 🧹 Preview

          The pull request is closed, so its preview was removed."
