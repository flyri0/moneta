name: Release

# Pushing a tag like v1.2.3 releases that version: every check runs, then the GitHub release is
# created with its notes (the changelog the app links to) and Netlify deploys. See CONTRIBUTING.md.
on:
  push:
    tags: ['v*.*.*']

# One release at a time, and never cancel one halfway through.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The app reads its version from package.json, so the tag must agree with it.
      - name: Tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)."
            exit 1
          fi

      # The Netlify build hook always builds the tip of main, so that is what must be tagged.
      - name: Tag is the tip of main
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::$GITHUB_REF_NAME is not the tip of main. Tag the latest commit on main."
            exit 1
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish and deploy
    needs: ci
    runs-on: ubuntu-latest
    # Holds the NETLIFY_BUILD_HOOK secret.
    environment: Moneta Environment
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Someone may have pushed to main while the checks ran; Netlify would build that instead.
      - name: Tag is still the tip of main
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main moved while the checks ran. Release again from its new tip."
            exit 1
          fi

      # Notes from the conventional commits since the previous tag (cliff.toml).
      - name: Write the release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      # Before the deploy, so the app's link to these notes never leads nowhere.
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Moneta $GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      # netlify.toml skips every Git-triggered build; a build hook build always runs.
      - name: Deploy to Netlify
        run: curl --fail --silent --show-error -X POST -d '{}' "$NETLIFY_BUILD_HOOK?trigger_title=Release+$GITHUB_REF_NAME"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
