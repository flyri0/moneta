name: Bug report
description: Something in Moneta does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not attach real financial data.** Moneta keeps your budget on your
        device, and an issue is public. Reproduce the problem with a throwaway budget
        before sharing files or screenshots.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in a sentence or two.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Budget screen for September
        2. Assign 100 to Groceries
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141, Firefox 145, Safari 26…
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system or device
      placeholder: Windows 11, macOS 26, Android 16 (Pixel 8)…
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Português (BR)
    validations:
      required: true

  - type: dropdown
    id: persistence
    attributes:
      label: Does it still happen after reloading the page?
      options:
        - 'Yes'
        - 'No'
        - I did not try
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: >-
        Console errors, screenshots of a throwaway budget, whether it also happens in
        another browser, or whether the app was installed as a PWA.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: >-
            This report contains no real financial data: no `.sqlite` backup of my own
            budget and no screenshots of my real balances.
          required: true
