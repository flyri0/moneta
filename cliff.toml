# git-cliff turns the conventional commits since the last tag into the release notes of each
# GitHub release (.github/workflows/release.yml). Only changes a user would notice are listed.
# Try it locally: pnpm dlx git-cliff --unreleased --strip header

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} (**breaking**){% endif %}
{%- endfor %}
{% endfor %}
{% if previous.version %}
**Full changelog:** https://github.com/flyri0/moneta/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The HTML comments only order the groups; `striptags` hides them.
commit_parsers = [
	{ message = "^chore\\(release\\)", skip = true },
	{ field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
	{ message = "^feat", group = "<!-- 1 -->Features" },
	{ message = "^fix", group = "<!-- 2 -->Bug fixes" },
	{ message = "^perf", group = "<!-- 3 -->Performance" },
	{ message = ".*", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
